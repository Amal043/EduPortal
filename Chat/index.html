<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp - Real-time Messaging</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-comments"></i>
                <h1>ChatApp</h1>
                <p>Connect with anyone, anywhere</p>
            </div>
            <div class="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <button class="login-btn" onclick="login()">
                    <span>Start Chatting</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            <div class="login-footer">
                <p>Real-time messaging • End-to-end encrypted</p>
            </div>
        </div>
    </div>

    <!-- Main Chat App -->
    <div class="chat-container" id="chatContainer" style="display: none;">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <h3 id="currentUsername">User</h3>
                        <span class="status online">
                            <i class="fas fa-circle"></i> Online
                        </span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="showSettings()" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button class="icon-btn" onclick="logout()" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchUsers" placeholder="Search users..." oninput="searchUsers()">
            </div>

            <div class="online-users">
                <h4><i class="fas fa-users"></i> Online Users (<span id="onlineCount">0</span>)</h4>
                <div id="usersList" class="users-list">
                    <div class="no-users">
                        <i class="fas fa-user-friends"></i>
                        <p>Waiting for users to join...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-user-info">
                    <div class="chat-avatar">
                        <i class="fas fa-comments"></i>
                    </div>
                    <div class="chat-details">
                        <h3 id="chatTitle">ChatApp</h3>
                        <span class="chat-status">
                            <i class="fas fa-circle"></i> 
                            <span id="chatStatusText">Select a user to start chatting</span>
                        </span>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" onclick="clearChat()" title="Clear chat">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button class="icon-btn" onclick="toggleEmojiPicker()" title="Emoji">
                        <i class="fas fa-smile"></i>
                    </button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message">
                    <i class="fas fa-comments"></i>
                    <h2>Welcome to ChatApp!</h2>
                    <p>Select a user from the sidebar to start chatting</p>
                    <div class="features">
                        <div class="feature">
                            <i class="fas fa-lock"></i>
                            <span>Secure</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-bolt"></i>
                            <span>Real-time</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-globe"></i>
                            <span>Online</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="message-input-container">
                <div class="emoji-picker" id="emojiPicker" style="display: none;">
                    <div class="emoji-grid" id="emojiGrid"></div>
                </div>
                <div class="message-input">
                    <button class="icon-btn" onclick="toggleEmojiPicker()">
                        <i class="fas fa-smile"></i>
                    </button>
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type a message..." 
                        onkeypress="handleEnter(event)"
                    >
                    <button class="send-btn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
